name: Website & Docs Build

on:
  push:
    branches: [main, master]
    paths:
      - "website/**"
      - "CHANGELOG.md"
      - ".github/workflows/website.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "website/**"
      - "CHANGELOG.md"
      - ".github/workflows/website.yml"

jobs:
  website-verify:
    name: Website (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm --prefix website ci

      - name: Verify website (generate, check, lint, typecheck, test, both build targets)
        run: npm --prefix website run verify

      - name: Isolated build test (copy website/ alone to temp directory)
        shell: bash
        run: |
          ISO_DIR=$(mktemp -d)
          cp -r website/. "$ISO_DIR/"
          rm -rf "$ISO_DIR/node_modules" "$ISO_DIR/dist" "$ISO_DIR/.astro"
          npm --prefix "$ISO_DIR" ci
          npm --prefix "$ISO_DIR" run check
          npm --prefix "$ISO_DIR" run build:website
          npm --prefix "$ISO_DIR" run build:embedded

      - name: Upload static website artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: patchwork-website-dist
          path: website/dist
          retention-days: 14
