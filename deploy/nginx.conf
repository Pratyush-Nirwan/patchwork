# Patchwork reverse proxy configuration (Nginx)
# Replace patchwork.example.com and files.patchwork.example.com with your actual domains.
# Ensure DNS A/AAAA records exist for both patchwork.example.com and files.patchwork.example.com.
# Set MINIO_PUBLIC_URL=https://files.patchwork.example.com in your .env file.

server {
    listen 80;
    server_name patchwork.example.com;

    client_max_body_size 20M;

    # Embedded documentation is served by Patchwork at /documentation with immutable asset caching
    location /documentation {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
}

server {
    listen 80;
    server_name files.patchwork.example.com;

    # Match Patchwork attachment upload limit
    client_max_body_size 20M;

    # Proxy directly to MinIO API without path rewriting so S3 v4 presigned URLs validate
    # Embedded documentation is served by Patchwork at /documentation with immutable asset caching
    location /documentation {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }
}
