areas:
  - id: "boards-and-tickets"
    title: "Boards and Tickets"
    description: "Organize multi-team engineering work with clear ownership and real-time updates."
    items:
      - id: "org-hierarchy"
        title: "Organization -> Teams -> Projects -> Boards -> Tickets"
        summary: "Strict multi-team hierarchy with server-enforced access scoping at every level."
        codeSignal: "table:orgs"
      - id: "kanban-wip"
        title: "Custom Kanban columns and WIP capacity gauges"
        summary: "Create, rename, reorder, and delete columns per team with optional WIP limits and visual capacity gauges."
        codeSignal: "table:columns"
      - id: "calendar-view"
        title: "Calendar view alongside Kanban"
        summary: "Switch any board between Kanban and Calendar views to inspect upcoming due dates."
        codeSignal: "command:due"
      - id: "ticket-rich-fields"
        title: "Markdown tickets, comments, and activity history"
        summary: "Write markdown descriptions and comments with assignees, priorities, labels, and full field/move activity logs."
        codeSignal: "table:ticket_activities"
      - id: "realtime-sse"
        title: "Live board sync via PostgreSQL LISTEN/NOTIFY and SSE"
        summary: "Board moves, edits, and comments stream to active viewers over /api/events without polling."
        codeSignal: "route:events"
      - id: "ticket-watchers"
        title: "Ticket watchers and muted notifications"
        summary: "Watch or unwatch tickets with auto-watch rules, /watch, /unwatch, /mute, and watching:me filtering."
        codeSignal: "table:ticket_watchers"
      - id: "mentions-and-inbox"
        title: "Real-time notification center and @mentions"
        summary: "Access-scoped @mention autocomplete with stable user-ID tokens and an SSE-powered bell inbox."
        codeSignal: "table:notifications"
      - id: "outbound-email-and-webhooks"
        title: "Optional SMTP emails and signed webhooks"
        summary: "Transactional outbox for immediate or digest SMTP alerts and HMAC-signed Generic, Slack, Discord, and Mattermost webhooks."
        codeSignal: "table:webhook_endpoints"

  - id: "search-and-commands"
    title: "Search and Command Bar"
    description: "Keyboard-first navigation, slash commands, and scoped full-text search."
    items:
      - id: "spotlight-palette"
        title: "Spotlight command bar (Ctrl+K / Cmd+K)"
        summary: "Open the palette from anywhere to jump to boards, filter tickets, or run slash commands with inline ghost hints."
        codeSignal: "command:new"
      - id: "slash-commands"
        title: "Slash commands with autocomplete and undo"
        summary: "Create, move, assign, prioritize, label, schedule, comment, and link tickets from the keyboard."
        codeSignal: "command:move"
      - id: "scoped-fts"
        title: "Scoped PostgreSQL full-text search"
        summary: "Ranked tsvector + GIN search across ticket titles, descriptions, comments, and extracted attachment text."
        codeSignal: "route:search"

  - id: "attachments-and-links"
    title: "Attachments and Forge Links"
    description: "Direct-to-MinIO file storage and GitHub/GitLab link previews."
    items:
      - id: "minio-presigned"
        title: "MinIO presigned attachments with text extraction"
        summary: "Upload .pdf, .txt, .md, .csv, .json, and image files directly to MinIO with MIME and size limits."
        codeSignal: "route:tickets"
      - id: "forge-links"
        title: "GitHub and GitLab link previews"
        summary: "Attach PR, MR, issue, and commit URLs to tickets with cached title and status previews."
        codeSignal: "command:link"

  - id: "security-and-admin"
    title: "Security, Roles, and Administration"
    description: "No public signup, server-enforced RBAC, and 12 System Configuration sections."
    items:
      - id: "rbac-roles"
        title: "Server-enforced RBAC and sub-roles"
        summary: "Organization admin plus team lead, member (developer/tester sub-roles), and viewer roles enforced on every API route."
        codeSignal: "permission:ticket.move"
      - id: "setup-wizard"
        title: "First-run Setup Wizard with encrypted one-time token"
        summary: "AES-256-GCM encrypted setup token protects initial admin registration, organization setup, and CSV employee import."
        codeSignal: "route:setup"
      - id: "system-config"
        title: "12-section System Configuration dashboard"
        summary: "Manage users, teams, password/session policies, storage limits, search reindexing, integrations, health checks, and exports."
        codeSignal: "route:system"

  - id: "operations-and-install"
    title: "Native Install and Operations"
    description: "Zero Docker on Windows 10/11 and Linux with Node.js >=20 and git."
    items:
      - id: "easy-install"
        title: "Three-step Easy install (Node.js + git only)"
        summary: "npm run setup provisions PostgreSQL 18 and SHA-256 verified MinIO locally, or connects to your own services in Advanced mode."
        codeSignal: "flag:--easy"
      - id: "supervisor"
        title: "Built-in process supervisor"
        summary: "npm run start, npm run stop, and npm run status manage PostgreSQL, MinIO, and Next.js together with reverse-order shutdown."
        codeSignal: "flag:--check"
      - id: "embedded-docs"
        title: "In-app documentation at /documentation"
        summary: "Every install bundles the Starlight documentation and Pagefind search on the same origin."
        codeSignal: "command:docs"
